name: Deploy to Droplet

on:
  push:
    branches: [main]

# Prevent two overlapping deploys if pushes land close together.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            git clone https://github.com/larbikhounti/mfah-erp.git
            cd /root/mfah-erp  # TODO: set the real path on the droplet
            git pull origin main

            # backend
            # Requires backend/.env to already exist on the server (DATABASE_URL,
            # JWT_ACCESS_SECRET, JWT_EXPIRATION_TIME, UPLOADS_DIR) — it's gitignored,
            # so `git pull` never touches it.
            cd backend
            npm ci
            npx prisma migrate deploy
            npx prisma generate
            npm run build --if-present
            cd ..

            # frontend
            # Requires frontend/.env.local to already exist on the server
            # (NEXT_PUBLIC_API_URL) — Next.js bakes it in at build time.
            cd frontend
            npm ci
            npm run build
            cd ..

            # restart apps
            # Assumes both processes were already registered once with
            # `pm2 start` (e.g. from an ecosystem file) named as below.
            # Restarting by name avoids touching any other pm2 process on
            # this box.
            pm2 restart mfah-backend mfah-frontend
